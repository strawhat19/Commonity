<svg id="commonity-v9-local-lock-fill" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 96 96" role="img" aria-labelledby="lock-fill-title lock-fill-description">
  <title id="lock-fill-title">Commonity — Compact Four-Segment Local Lock</title>
  <desc id="lock-fill-description">The filled locator pin contains a smaller, thinner white C and four shorter white circular segments pulled inward toward the center of the green window. The four equal arcs remain symmetric at ninety-degree rotations.</desc>
  <rect id="lock-fill-tile" width="96" height="96" rx="22" fill="#0DD5B2"/>
  <path id="lock-fill-pin" d="M48 10C29 10 15 24.5 15 43c0 18.5 15.5 33.5 33 46 17.5-12.5 33-27.5 33-46C81 24.5 67 10 48 10Z" fill="#FFFFFF"/>
  <circle id="lock-fill-window" cx="48" cy="43" r="25" fill="#0DD5B2"/>
  <g id="lock-fill-circular-brackets" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <path id="lock-fill-top-arc" d="M39.314776 26.665470A18.5 18.5 0 0 1 56.685224 26.665470"/>
    <path id="lock-fill-right-arc" d="M39.314776 26.665470A18.5 18.5 0 0 1 56.685224 26.665470" transform="rotate(90 48 43)"/>
    <path id="lock-fill-bottom-arc" d="M39.314776 26.665470A18.5 18.5 0 0 1 56.685224 26.665470" transform="rotate(180 48 43)"/>
    <path id="lock-fill-left-arc" d="M39.314776 26.665470A18.5 18.5 0 0 1 56.685224 26.665470" transform="rotate(270 48 43)"/>
  </g>
  <path id="lock-fill-capital-c" transform="translate(48 43) scale(.8) translate(-48 -43)" d="M58.5 34c-3.2-3.7-6.7-5-11-5C39.1 29 33 35.3 33 43s6.1 14 14.5 14c4.3 0 7.8-1.3 11-5" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  <path id="lock-fill-pin-stem" d="M48 72v8" fill="none" stroke="#0DD5B2" stroke-width="3" stroke-linecap="round"/>
</svg>
